name: push-pr

on: 
    push:
        branches:
            - main
            - "release/**"
        paths:
            - "src/**"
            - "test/**"
            - "requirements*.txt"
            - "pyproject.toml"
            - ".github/workflows/**"

    pull_request:
        branches:
            - main
            - "release/**"

jobs:
    test:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v6.1.0
            
            - name: Setup python
              uses: actions/setup-python@v5
              with:
                python-version: "3.11"

            - name: Cache pip dependencies
              uses: actions/cache@v4
              with:
                path: ~/.cache/pip
                key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements*.txt') }}
                restore-keys: |
                    ${{ runner.os }}-pip-
                
            - name: Install dependencies
              run: |
                python -m pip install --upgrade pip
                python -m pip install -r requirements.txt

            - name: Verify pytest
              run: python -m pytest --version

            - name: Run Tests
              run: pytest test/ -v --cov=src --cov-report=term-missing